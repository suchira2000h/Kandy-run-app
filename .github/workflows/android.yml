name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Portrait + fullscreen + app icon
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' "$MANIFEST"
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' "$STYLES"
          # remove the default adaptive-icon XML, then copy our pre-made icons over the Capacitor ones
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          cp -r resources/android/* android/app/src/main/res/
          ls -la android/app/src/main/res/mipmap-xxxhdpi/

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kandy-run-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
